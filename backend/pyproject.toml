[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI resolve File() como dependência da requisição.
"app/routers/*.py" = ["B008"]

[tool.pytest.ini_options]
minversion = "8.4"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config --disable-plugin-autoload -p pytest_cov"

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
